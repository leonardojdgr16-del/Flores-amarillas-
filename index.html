<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galaxia de Flores Amarillas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Arial', sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Estilo de la ventana de código CSS flotante (como en el video) */
    .css-card {
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 320px;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 15px;
      padding: 12px 16px;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      pointer-events: none;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.75rem;
      color: #e0e0e0;
    }
    .css-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 4px;
    }
    .dots {
      display: flex;
      gap: 5px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }
    .filename {
      color: #888;
      font-size: 0.7rem;
    }
    .code-line { line-height: 1.4; }
    .keyword { color: #ff79c6; }
    .selector { color: #f1fa8c; }
    .property { color: #8be9fd; }
    .value { color: #bd93f9; }

    /* Etiquetas 3D flotantes */
    .floating-label {
      position: absolute;
      color: #fff8dc;
      font-family: 'Georgia', serif;
      font-size: 0.75rem;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.9), 0 0 15px rgba(255, 140, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s;
      font-weight: bold;
    }
    
    .title-banner {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #fff;
      text-align: center;
      width: 100%;
      pointer-events: none;
    }
    .title-banner h1 {
      font-size: 1.1rem;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255,215,0,0.8);
      margin-bottom: 4px;
    }
    .title-banner p {
      font-size: 0.8rem;
      color: #ccc;
    }
  </style>

  <!-- Three.js y OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Tarjeta con código CSS flotante -->
  <div class="css-card">
    <div class="css-header">
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <span class="filename">Style.css</span>
    </div>
    <div class="code-line"><span class="selector">.Flores_Amarillas</span> {</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">position</span>: <span class="value">absolute</span>;</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">width</span>: <span class="value">90%</span>;</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">font-size</span>: <span class="value">2rem</span>;</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">font-family</span>: <span class="value">"Te Amo"</span>;</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">height</span>: <span class="value">var(--letter-love)</span>;</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">transform</span>: <span class="value">translateX(-50%)</span>;</div>
    <div class="code-line">&nbsp;&nbsp;<span class="property">background</span>: <span class="value">var(--letter)</span>;</div>
    <div class="code-line">}</div>
  </div>

  <div class="title-banner">
    <h1>Galaxia de Amor con Flores Amarillas</h1>
    <p>Para Dedicar ✨</p>
  </div>

  <div id="labels-container"></div>

  <script>
    // 1. Escena, Cámara y Renderizador
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.03);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 18);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 30;
    controls.minDistance = 5;

    // 2. Luces
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffd700, 3, 20);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // 3. Crear Textura de Girasol programáticamente
    function createSunflowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      // Centro (marrón)
      ctx.beginPath();
      ctx.arc(64, 64, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#4a2511';
      ctx.fill();

      // Pétalos amarillos
      const petals = 16;
      for (let i = 0; i < petals; i++) {
        const angle = (i * Math.PI * 2) / petals;
        ctx.save();
        ctx.translate(64, 64);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 38, 8, 18, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd700';
        ctx.fill();
        ctx.restore();
      }

      return new THREE.CanvasTexture(canvas);
    }

    const flowerTexture = createSunflowerTexture();

    // 4. Espiral de Partículas y Flores Amarillas
    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    const flowerMaterial = new THREE.SpriteMaterial({ map: flowerTexture, transparent: true });
    const flowerCount = 60;

    for (let i = 0; i < flowerCount; i++) {
      const sprite = new THREE.Sprite(flowerMaterial);
      const radius = Math.random() * 10 + 1.5;
      const angle = radius * 1.8 + (Math.PI * 2 * (i % 4)) / 4;
      
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.z = Math.sin(angle) * radius;
      sprite.position.y = (Math.random() - 0.5) * 1.5;

      const scale = Math.random() * 0.4 + 0.5;
      sprite.scale.set(scale, scale, 1);
      galaxyGroup.add(sprite);
    }

    // Partículas de polvo dorado
    const particleCount = 2000;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    const color1 = new THREE.Color(0xffd700);
    const color2 = new THREE.Color(0xff8c00);

    for (let i = 0; i < particleCount; i++) {
      const radius = Math.random() * 12 + 0.2;
      const spinAngle = radius * 2;
      const branchAngle = ((i % 4) * 2 * Math.PI) / 4;

      positions[i * 3] = Math.cos(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 0.5;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 1.2;
      positions[i * 3 + 2] = Math.sin(branchAngle + spinAngle) * radius + (Math.random() - 0.5) * 0.5;

      const mixedColor = color1.clone().lerp(color2, Math.random());
      colors[i * 3] = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.06,
      vertexColors: true,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(geometry, particleMaterial);
    galaxyGroup.add(particles);

    // 5. Corazón en el Centro
    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, 0);
    heartShape.bezierCurveTo(0, 0.3, -0.5, 0.8, -1, 0.8);
    heartShape.bezierCurveTo(-1.8, 0.8, -1.8, -0.2, -1.8, -0.2);
    heartShape.bezierCurveTo(-1.8, -0.8, -1, -1.4, 0, -2);
    heartShape.bezierCurveTo(1, -1.4, 1.8, -0.8, 1.8, -0.2);
    heartShape.bezierCurveTo(1.8, -0.2, 1.8, 0.8, 1, 0.8);
    heartShape.bezierCurveTo(0.5, 0.8, 0, 0.3, 0, 0);

    const heartGeo = new THREE.ShapeGeometry(heartShape);
    const heartMat = new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide });
    const heartMesh = new THREE.Mesh(heartGeo, heartMat);
    heartMesh.scale.set(0.4, 0.4, 0.4);
    heartMesh.rotation.x = Math.PI;
    heartMesh.position.y = 0.5;
    scene.add(heartMesh);

    // 6. Textos Flotantes Dedicados
    const phrases = [
      "Te amo", "Mi Amor", "Eres mi todo", "Mi reina", 
      "Siempre juntos", "Mi niña preciosa", "Mi sol", "Universo de amor"
    ];

    const labelsContainer = document.getElementById('labels-container');
    const labelElements = [];

    phrases.forEach((phrase) => {
      const div = document.createElement('div');
      div.className = 'floating-label';
      div.innerText = phrase;
      labelsContainer.appendChild(div);

      const radius = Math.random() * 8 + 2;
      const angle = Math.random() * Math.PI * 2;
      const pos = new THREE.Vector3(
        Math.cos(angle) * radius,
        (Math.random() - 0.5) * 2,
        Math.sin(angle) * radius
      );

      labelElements.push({ element: div, pos: pos });
    });

    function updateLabels() {
      labelElements.forEach((item) => {
        const tempV = item.pos.clone();
        tempV.applyAxisAngle(new THREE.Vector3(0, 1, 0), galaxyGroup.rotation.y);
        tempV.project(camera);

        const x = (tempV.x * .5 + .5) * window.innerWidth;
        const y = (tempV.y * -.5 + .5) * window.innerHeight;

        item.element.style.transform = `translate(-50%, -50%) translate(${x}px,${y}px)`;
        item.element.style.opacity = tempV.z < 1 ? 1 : 0;
      });
    }

    // 7. Bucle de Animación
    function animate() {
      requestAnimationFrame(animate);

      galaxyGroup.rotation.y += 0.0025;

      // Latido del corazón central
      const scale = 0.35 + Math.sin(Date.now() * 0.003) * 0.05;
      heartMesh.scale.set(scale, scale, scale);
      heartMesh.rotation.y += 0.01;

      controls.update();
      updateLabels();
      renderer.render(scene, camera);
    }

    animate();

    // Redimensionar pantalla
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
